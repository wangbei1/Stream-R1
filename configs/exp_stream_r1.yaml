# Stream-R1 — Reliability-Complexity Aware Reward Distillation
#
# Final shipped configuration. The flags here implement the three
# components of Stream-R1 (Sec. 3 of the paper):
#   - reward_mode: BalancedOverall       → Inter-Reliability score
#                                           + Adaptive Reward Balancing
#   - spatial_reward (pixel-grad)        → Intra-Complexity (spatial)
#   - temporal_saliency_weighting        → Intra-Complexity (temporal)
#   - spatial_reward_combination: adaptive
#                                        → adaptive saliency combination
#                                           across VQ / MQ / TA
#   - spatial_reward_min_weight: 0.15    → intra spatial floor (sigma_min)
#   - temporal_saliency_min_weight: 0.2  → intra temporal floor (tau_min)
generator_ckpt: checkpoints/ode_init.pt
generator_fsdp_wrap_strategy: size
real_score_fsdp_wrap_strategy: size
fake_score_fsdp_wrap_strategy: size
real_name: Wan2.1-T2V-14B
fake_name: Wan2.1-T2V-1.3B
text_encoder_fsdp_wrap_strategy: size
denoising_step_list:
- 1000
- 750
- 500
- 250
warp_denoising_step: true
ts_schedule: false
num_train_timestep: 1000
timestep_shift: 5.0
guidance_scale: 3.0
denoising_loss_type: flow
mixed_precision: true
seed: 0
wandb_host: WANDB_HOST
wandb_key: WANDB_KEY
wandb_entity: WANDB_ENTITY
wandb_project: WANDB_PROJECT
sharding_strategy: hybrid_full
lr: 2.0e-06
lr_critic: 4.0e-07
beta1: 0.0
beta2: 0.999
beta1_critic: 0.0
beta2_critic: 0.999
data_path: prompts/vidprom_filtered_extended.txt
batch_size: 1
ema_weight: 0.99
ema_start_step: 200
gradient_accumulation_steps: 8
log_iters: 200
negative_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'
dfake_gen_update_ratio: 5
image_or_video_shape:
- 1
- 21
- 16
- 60
- 104
distribution_loss: rewardeddmd
trainer: rewarded_distillation
gradient_checkpointing: true
full_training_steps: 1000
num_frame_per_block: 3
load_raw_video: false
beta: 2.0
model_kwargs:
  timestep_shift: 5.0
  local_attn_size: 9
  sink_size: 3
checkpoint_path: checkpoints

# ---- Spatial reward localization ----
spatial_reward: true
spatial_reward_method: gradient
spatial_reward_pixel_grad: true
spatial_reward_metrics:
- MQ
- VQ
- TA
spatial_reward_strength: 1.0
spatial_reward_min_weight: 0.15
spatial_reward_combination: adaptive
spatial_reward_temperature: 1.0

# Reward mode: Overall (mean of VQ/MQ/TA) + improvement-balance penalty
reward_mode: BalancedOverall

# ===== Temporal Saliency Weighting (data-driven) =====
# Derives per-frame importance from gradient saliency magnitude.
# Frames with higher overall saliency receive more optimization pressure.
temporal_saliency_weighting: true
temporal_saliency_strength: 1.0
temporal_saliency_min_weight: 0.2
